[package]
name = "impro-vte"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gtk.workspace = true
gdk.workspace = true
glib.workspace = true
gio.workspace = true
pango.workspace = true
libc.workspace = true
bitflags.workspace = true
alacritty_terminal = { version = "=0.26.0", default-features = false, optional = true }
regex = { workspace = true, optional = true }
unicode-width = { version = "0.2.2", optional = true }

[target.'cfg(unix)'.dependencies]
impro-vte-sys = { path = "sys" }

[target.'cfg(windows)'.dependencies]
alacritty_terminal = { version = "=0.26.0", default-features = false }
regex.workspace = true
unicode-width = "0.2.2"
pangocairo.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse"] }

[features]
emulator = ["dep:alacritty_terminal", "dep:regex", "dep:unicode-width"]
# Compile the Windows stub backend on every platform (as `impro_vte::stub`) so it can be tested.
stub-backend = []
