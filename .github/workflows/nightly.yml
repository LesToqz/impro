name: Nightly

# Slow checks that no pull request waits for. Nothing requires these jobs; a
# red run sends the usual failed-workflow notification.

on:
  schedule:
    - cron: "41 1 * * *"
  workflow_dispatch:
    inputs:
      base:
        description: "Git ref (branch, tag or commit) to compare against; empty picks the last main commit that is at least 7 days old"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # Keep in step with ci.yml.
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------- perf-ab
  perf-ab:
    name: Performance A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # Both builds use the same relaxed settings, which saves a lot of build
      # time. The numbers are only meaningful relative to each other, never as
      # absolute figures.
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      BUILD_ARGS: >-
        --release --locked -p impro -p impro-graph --bin impro
        --example window_qa --example startup_floor --example graph_bench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Choose the base commit
        id: base
        env:
          BASE_INPUT: ${{ inputs.base }}
        run: |
          set -euo pipefail
          if [[ -n $BASE_INPUT ]]; then
            base=$(git rev-parse --verify --quiet "${BASE_INPUT}^{commit}" ||
              git rev-parse --verify --quiet "origin/${BASE_INPUT}^{commit}") || {
              echo "::error::cannot resolve base ref '$BASE_INPUT'"
              exit 2
            }
          else
            base=$(git rev-list -n 1 --before='7 days ago' origin/main)
            if [[ -z $base ]]; then
              base=$(git rev-parse HEAD~1)
            fi
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          {
            echo '## Performance A/B'
            echo
            echo "Base: \`$(git log -1 --format='%h %s' "$base")\`"
            echo "Head: \`$(git log -1 --format='%h %s' HEAD)\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup-linux-gui
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: ""
          gui: "true"
          nextest: "false"
          cache-key: perf-ab
      - name: Build head
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-head
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # BUILD_ARGS is a word list
          cargo build $BUILD_ARGS
          mkdir -p "$RUNNER_TEMP/ab/head/examples"
          cp "$CARGO_TARGET_DIR/release/impro" "$RUNNER_TEMP/ab/head/"
          cp "$CARGO_TARGET_DIR"/release/examples/{window_qa,startup_floor,graph_bench} \
            "$RUNNER_TEMP/ab/head/examples/"
      - name: Build base
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target-base
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/base-src"
          mkdir -p "$src"
          git archive "$BASE_SHA" | tar -x -C "$src"
          cd "$src"
          # An old base may lack a target or a lockfile entry; report that
          # instead of failing silently.
          # shellcheck disable=SC2086  # BUILD_ARGS is a word list
          if ! cargo build $BUILD_ARGS; then
            {
              echo "The base commit \`$BASE_SHA\` could not be built with the current build"
              echo "command, so nothing was compared. Pick a newer base with the \`base\` input."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          mkdir -p "$RUNNER_TEMP/ab/base/examples"
          cp "$CARGO_TARGET_DIR/release/impro" "$RUNNER_TEMP/ab/base/"
          cp "$CARGO_TARGET_DIR"/release/examples/{window_qa,startup_floor,graph_bench} \
            "$RUNNER_TEMP/ab/base/examples/"
      - name: Compare base and head
        env:
          GDK_BACKEND: x11
          GIO_USE_VFS: local
        run: >-
          xvfb-run -a dbus-run-session --
          python3 scripts/ci/ab_perf.py
          --before "$RUNNER_TEMP/ab/base"
          --after "$RUNNER_TEMP/ab/head"
          --runs 20
          --output "$RUNNER_TEMP/ab/ab-perf.json"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload A/B results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-ab
          path: ${{ runner.temp }}/ab/ab-perf.json
          retention-days: 30
          if-no-files-found: ignore

  # ---------------------------------------------------------------- soak
  soak:
    name: Graph view soak
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Seconds of randomised use; the build before it takes several minutes.
      IMPRO_SOAK_SECONDS: "600"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux-gui
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: ""
          gui: "true"
          nextest: "false"
          cache-key: soak
      - name: Run the soak test in release mode
        env:
          GDK_BACKEND: x11
          GIO_USE_VFS: local
          G_DEBUG: fatal-criticals
        run: >-
          xvfb-run -a dbus-run-session --
          cargo test --release --locked -p impro-graph --test view_soak
          -- --include-ignored --nocapture

  # ---------------------------------------------------------- flake-hunt
  flake-hunt:
    name: Flake hunt
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux-gui
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: ""
          gui: "true"
          nextest: "false"
          cache-key: flake-hunt
      - name: Run the whole suite three times
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/flake"
          bad_runs=0
          for run in 1 2 3; do
            log="$RUNNER_TEMP/flake/run-$run.log"
            : > "$log"
            run_failed=0
            # Same groups, in the same order, as `run-tests.sh all`, but a
            # failing group does not stop the later ones.
            for group in unit integration doc js; do
              scripts/ci/run-tests.sh "$group" 2>&1 | tee -a "$log" || run_failed=1
            done
            if [[ $run_failed -ne 0 ]]; then
              bad_runs=$((bad_runs + 1))
            fi
            echo "$run_failed" > "$RUNNER_TEMP/flake/run-$run.status"
          done
          {
            echo '## Flake hunt'
            echo
            echo "Failed runs: $bad_runs of 3"
            for run in 1 2 3; do
              names=$({ grep -E '^test .* \.\.\. FAILED$' "$RUNNER_TEMP/flake/run-$run.log" |
                sed -E 's/^test (.*) \.\.\. FAILED$/\1/';
                grep -E '^not ok [0-9]+ - ' "$RUNNER_TEMP/flake/run-$run.log" |
                sed -E 's/^not ok [0-9]+ - /js: /'; } | sort -u || true)
              echo
              echo "### Run $run"
              if [[ $(cat "$RUNNER_TEMP/flake/run-$run.status") -eq 0 ]]; then
                echo 'all tests passed'
              elif [[ -n $names ]]; then
                echo '```'
                echo "$names"
                echo '```'
              else
                echo 'failed without a recognised test name (build error or crash); see the log artifact'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          [[ $bad_runs -eq 0 ]]
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-logs
          path: ${{ runner.temp }}/flake/*.log
          retention-days: 7
          if-no-files-found: ignore

  # --------------------------------------------------- toolchain-canary
  toolchain-canary:
    name: Toolchain canary (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux-gui
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
          gui: "true"
          nextest: "false"
          cache-key: canary-${{ matrix.toolchain }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check
        run: cargo check --workspace --all-targets --locked

  # ------------------------------------------------------------ coverage
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux-gui
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview
          gui: "true"
          nextest: "false"
          cache-key: coverage
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Run the workspace tests with coverage
        env:
          GDK_BACKEND: x11
          GIO_USE_VFS: local
          G_DEBUG: fatal-criticals
        run: >-
          xvfb-run -a dbus-run-session --
          cargo llvm-cov --no-report --workspace --locked --no-fail-fast
      - name: Write the report
        if: always()
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          {
            echo '## Coverage (report only, no threshold)'
            echo
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lcov.info
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov
          path: lcov.info
          retention-days: 14
          if-no-files-found: ignore
