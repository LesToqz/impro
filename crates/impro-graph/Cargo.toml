[package]
name = "impro-graph"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Project graph: link parsing, project index, filters, preferences, force layout and the native Graph view"

[lib]
name = "impro_graph"

[dependencies]
serde_json = "1"
regex = "1"
memchr = "2"
gtk = { workspace = true, features = ["v3_24"] }
gdk.workspace = true
glib.workspace = true
gio.workspace = true
cairo-rs = { workspace = true, features = ["png"] }
pango.workspace = true
atk = "~0.18.2"
pangocairo.workspace = true
impro-core.workspace = true
impro-ui.workspace = true

[dev-dependencies]
tempfile = "3"
gdk-pixbuf.workspace = true
