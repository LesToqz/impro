# TEMPORARY. Collects diagnostics for the GTK test crashes seen on the hosted
# runner (SIGTRAP after a GLib-GObject critical, SIGSEGV). Delete this file once
# the runner failures are understood. It only writes to the job log.
name: CI diagnose (temporary)

on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/ci-diagnose.yml']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_VERSION: "1.99.1"

jobs:
  diagnose:
    name: Diagnose GTK test crashes
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-linux-gui
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: ""
          gui: "true"
          nextest: "false"
          cache-key: diagnose

      - name: Print library and package versions
        continue-on-error: true
        run: |
          dpkg -l | grep -E 'libgtk-3-0t64|libvte-2.91|libglib2.0-0|libpango|libcairo2|libgdk-pixbuf|librsvg2|adwaita|yaru|at-spi2|gsettings-desktop-schemas|libwebkit2gtk' || true
          echo '--- gdk-pixbuf SVG loader'
          gdk-pixbuf-query-loaders | grep -i svg || echo 'no SVG loader registered'
          echo '--- /usr/share/icons'
          ls /usr/share/icons
          echo '--- font count'
          fc-list | wc -l

      - name: Build the crashing test binaries and the examples
        run: |
          cargo test --no-run --locked \
            -p impro-terminal --test test_resizegate --test test_terminal_startup \
            -p impro-chrome --test test_prompt
          cargo build --examples --workspace --locked

      - name: Run each binary three ways
        continue-on-error: true
        env:
          GDK_BACKEND: x11
          GIO_USE_VFS: local
          RUST_BACKTRACE: full
        run: |
          for name in test_resizegate test_terminal_startup test_prompt; do
            bin=$(find target/debug/deps -maxdepth 1 -type f -executable -name "$name-*" ! -name '*.d' | head -n1)
            echo "##### $name -> $bin"
            echo "=== $name: G_DEBUG=fatal-criticals (as CI)"
            G_DEBUG=fatal-criticals xvfb-run -a dbus-run-session -- "$bin" && rc=0 || rc=$?
            echo "exit code: $rc"
            echo "=== $name: G_DEBUG unset, --nocapture"
            env -u G_DEBUG xvfb-run -a dbus-run-session -- "$bin" --nocapture && rc=0 || rc=$?
            echo "exit code: $rc"
            echo "=== $name: --test-threads 1"
            G_DEBUG=fatal-criticals xvfb-run -a dbus-run-session -- "$bin" --test-threads 1 && rc=0 || rc=$?
            echo "exit code: $rc"
          done
          exit 0

      - name: Backtraces under gdb
        continue-on-error: true
        env:
          GDK_BACKEND: x11
          GIO_USE_VFS: local
          RUST_BACKTRACE: full
        run: |
          sudo apt-get install -y --no-install-recommends gdb
          for name in test_resizegate test_terminal_startup test_prompt; do
            bin=$(find target/debug/deps -maxdepth 1 -type f -executable -name "$name-*" ! -name '*.d' | head -n1)
            echo "##### $name -> $bin"
            log=$(mktemp)
            G_DEBUG=fatal-criticals xvfb-run -a dbus-run-session -- "$bin" --test-threads 1 --nocapture >"$log" 2>&1 && rc=0 || rc=$?
            echo "serial run exit code: $rc"
            if [[ $rc -eq 0 ]]; then
              echo "no crash with --test-threads 1; nothing to trace"
              continue
            fi
            first=$(grep -oE '^test [^ ]+ \.\.\.' "$log" | tail -n1 | awk '{print $2}')
            echo "first failing test: ${first:-unknown}"
            [[ -n $first ]] || continue
            echo "=== $name: gdb, G_DEBUG=fatal-criticals"
            G_DEBUG=fatal-criticals xvfb-run -a dbus-run-session -- \
              gdb -batch -ex run -ex bt -ex 'thread apply all bt 12' \
              --args "$bin" "$first" --exact --test-threads 1 --nocapture || true
            echo "=== $name: gdb, G_DEBUG=fatal-criticals G_SLICE=always-malloc"
            G_SLICE=always-malloc G_DEBUG=fatal-criticals xvfb-run -a dbus-run-session -- \
              gdb -batch -ex run -ex bt -ex 'thread apply all bt 12' \
              --args "$bin" "$first" --exact --test-threads 1 --nocapture || true
          done
          exit 0

      - name: Icon tests with output
        continue-on-error: true
        env:
          GDK_BACKEND: x11
          GIO_USE_VFS: local
          G_DEBUG: fatal-criticals
          RUST_BACKTRACE: full
        run: |
          xvfb-run -a dbus-run-session -- cargo test --locked \
            -p impro-explorer --test test_icons \
            -p impro-ui --test test_icons \
            -p impro-terminal --test test_terminal_bar \
            -- --nocapture
