[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
gtk = "~0.18.2"
gdk = "~0.18.2"
glib = "~0.18.5"
gio = "~0.18.4"
cairo-rs = "~0.18.5"
pango = "~0.18.3"
pangocairo = "~0.18.0"
gdk-pixbuf = "~0.18.5"
webkit2gtk = "~2.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
libc = "0.2"
bitflags = "2"
pkg-config = "0.3"
tempfile = "3"
impro-core = { path = "crates/impro-core" }
impro-ui = { path = "crates/impro-ui" }
impro-vte = { path = "crates/impro-vte" }

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
