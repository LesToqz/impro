[package]
name = "impro-gitviews"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1.0.145"
gtk.workspace = true
gdk.workspace = true
glib.workspace = true
gio.workspace = true
impro-core.workspace = true

[target.'cfg(unix)'.dependencies]
webkit2gtk = { workspace = true, features = ["v2_40"] }
javascriptcore = { package = "javascriptcore-rs", version = "1.1" }

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[features]
# Compile the Windows stub host on every platform (as `impro_gitviews::stub`) so it can be tested.
stub-backend = []

[dev-dependencies]
tempfile.workspace = true
