name: Security

# Dependency policy, secret scanning, workflow linting and CodeQL.
#
# CodeQL: this workflow is the *advanced* setup. Code Scanning "default setup"
# must stay disabled in the repository settings (Settings > Advanced Security),
# otherwise both setups upload results and the analysis is rejected/duplicated.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 03:23 UTC (off-peak): picks up newly published advisories.
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_DENY_VERSION: "0.20.2"
  GITLEAKS_VERSION: "8.30.1"
  ACTIONLINT_VERSION: "1.7.12"
  ZIZMOR_VERSION: "1.31.1"
  # SHA-256 of zizmor-x86_64-unknown-linux-gnu.tar.gz for the release above
  # (zizmor does not publish a checksums file; value taken from the release
  # asset digest).
  ZIZMOR_SHA256: "d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99"

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2

      - name: Check advisories, bans, licenses and sources
        run: cargo deny --locked check advisories bans licenses sources

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --output "${dir}/${archive}" "${base}/${archive}"
          curl --fail --silent --show-error --location --output "${dir}/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "${dir}" && grep " ${archive}\$" checksums.txt | sha256sum --check --strict -)
          mkdir -p "${RUNNER_TEMP}/gitleaks"
          tar -xzf "${dir}/${archive}" -C "${RUNNER_TEMP}/gitleaks" gitleaks
          echo "${RUNNER_TEMP}/gitleaks" >> "${GITHUB_PATH}"

      - name: Scan full git history
        run: gitleaks git --redact --no-banner --verbose --exit-code 1 .

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --output "${dir}/${archive}" "${base}/${archive}"
          curl --fail --silent --show-error --location --output "${dir}/checksums.txt" "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd "${dir}" && grep " ${archive}\$" checksums.txt | sha256sum --check --strict -)
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${dir}/${archive}" -C "${RUNNER_TEMP}/bin" actionlint
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Install zizmor
        run: |
          set -euo pipefail
          archive="zizmor-x86_64-unknown-linux-gnu.tar.gz"
          dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --output "${dir}/${archive}" \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/${archive}"
          echo "${ZIZMOR_SHA256}  ${dir}/${archive}" | sha256sum --check --strict -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${dir}/${archive}" -C "${RUNNER_TEMP}/bin" zizmor
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity medium --no-progress .github

  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
