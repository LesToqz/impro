name: Windows

# Builds impro for x86_64-pc-windows-gnu with GTK3 from MSYS2 UCRT64, packages an
# installer and a portable zip, and smoke-tests the installed application.
# See packaging/windows/README.md for the layout and the runbook.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Minimum supported Rust version (README and workspace manifest). The Rust
  # compiler itself comes from the MSYS2 package (see .github/actions/setup-windows).
  MSRV: "1.88"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # The runner has 4 vCPUs; .cargo/config.toml caps jobs lower for the dev machine.
  CARGO_BUILD_JOBS: 4
  # Outside the MSYS2 HOME (which differs from the Windows profile) so rust-cache finds the registry.
  CARGO_HOME: D:\cargo-home

jobs:
  # --------------------------------------------------------------- check
  check:
    name: Check (Windows)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          cache-key: check
          msrv: ${{ env.MSRV }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Cargo check
        shell: msys2 {0}
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        shell: msys2 {0}
        run: cargo clippy --workspace --locked -- -D warnings

  # ---------------------------------------------------------------- test
  # Report-only until promoted: failures here do not fail the workflow.
  test:
    name: Tests (Windows, report-only)
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          cache-key: test
          msrv: ${{ env.MSRV }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Logic crates
        shell: msys2 {0}
        run: cargo test --locked -p impro-core -p impro-graph -p impro-gitviews
      - name: GUI crates (report only)
        continue-on-error: true
        shell: msys2 {0}
        run: cargo test --locked --workspace --no-fail-fast

  # ------------------------------------------------------------- package
  package:
    name: Package (installer + portable zip)
    runs-on: windows-2025
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          cache-key: release
          msrv: ${{ env.MSRV }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Read workspace version
        id: version
        shell: msys2 {0}
        run: |
          set -euo pipefail
          version=$(scripts/package/windows/workspace-version.sh .)
          echo "impro version: $version"
          echo "version=$version" >> "$(cygpath -u "$GITHUB_OUTPUT")"

      - name: Build release binary
        shell: msys2 {0}
        run: cargo build --release --locked -p impro

      - name: Bundle GTK runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ls -l target/release/impro.exe
          python packaging/windows/bundle.py \
            --prefix "$(cygpath -m "$MINGW_PREFIX")" \
            --exe target/release/impro.exe \
            --out dist/impro
          mkdir -p dist/out
          scripts/package/windows/imports-report.sh dist/impro dist/out/imports-report.txt
          cp dist/impro/bundle-manifest.txt dist/out/bundle-manifest.txt

      - name: Portable zip
        shell: msys2 {0}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package/windows/make-portable-zip.sh dist/impro "$VERSION" dist/out

      - name: Installer (Inno Setup)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INNO_CHOCO_VERSION: "6.7.1"
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-Iscc {
            $candidates = @(
              (Get-Command ISCC.exe -ErrorAction SilentlyContinue | ForEach-Object Source),
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
            )
            $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Host "ISCC.exe not on the image, installing innosetup $env:INNO_CHOCO_VERSION with Chocolatey"
            choco install innosetup --version $env:INNO_CHOCO_VERSION --no-progress -y
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw 'ISCC.exe not found after installation' }
          Write-Host "ISCC: $iscc"
          $root = (Get-Location).Path
          $bundle = Join-Path $root 'dist\impro'
          $out = Join-Path $root 'dist\out'
          & $iscc "/DMyAppVersion=$env:VERSION" "/DMyBundleDir=$bundle" "/DMyOutputDir=$out" 'packaging\windows\impro.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited with $LASTEXITCODE" }
          $setup = Join-Path $out "impro-$env:VERSION-x64-setup.exe"
          if (-not (Test-Path -LiteralPath $setup)) { throw "installer not produced: $setup" }
          Get-ChildItem -LiteralPath $out | Format-Table Name, Length | Out-String | Write-Host

      - name: Checksums
        shell: msys2 {0}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          scripts/package/windows/write-checksums.sh dist/out "$VERSION"
          cat dist/out/SHA256SUMS.txt

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: impro-windows
          path: dist/out/*
          retention-days: 30
          if-no-files-found: error

  # --------------------------------------------------------------- smoke
  smoke:
    name: Smoke test (installed app)
    needs: package
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: impro-windows
          path: ${{ runner.temp }}\pkg
      - name: Installer, installed app, uninstaller
        shell: pwsh
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: >-
          ./packaging/windows/smoke.ps1 -Mode installer
          -Artifacts "$env:RUNNER_TEMP\pkg" -Version $env:VERSION
          -OutDir "$env:RUNNER_TEMP\smoke"
      - name: Portable zip
        shell: pwsh
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: >-
          ./packaging/windows/smoke.ps1 -Mode portable
          -Artifacts "$env:RUNNER_TEMP\pkg" -Version $env:VERSION
          -OutDir "$env:RUNNER_TEMP\smoke"
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-smoke
          path: ${{ runner.temp }}\smoke\*
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------- windows-success
  # Aggregate of the required jobs (the report-only `test` job is not listed).
  windows-success:
    name: Windows success
    needs:
      - check
      - package
      - smoke
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {name: job["result"] for name, job in needs.items() if job["result"] != "success"}
          for name, job in needs.items():
              print(name, job["result"])
          if bad:
              sys.exit("not successful: " + ", ".join(f"{n}={r}" for n, r in bad.items()))
          '
