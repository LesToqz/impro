name: Windows

# Builds impro for x86_64-pc-windows-gnu with GTK3 from MSYS2 UCRT64, packages an
# installer and a portable zip, and smoke-tests the installed application.
# See packaging/windows/README.md for the layout and the runbook.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Minimum supported Rust version (README and workspace manifest). The Rust
  # compiler itself comes from the MSYS2 package (see .github/actions/setup-windows).
  MSRV: "1.88"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # The runner has 4 vCPUs; .cargo/config.toml caps jobs lower for the dev machine.
  CARGO_BUILD_JOBS: 4
  # Outside the MSYS2 HOME (which differs from the Windows profile) so rust-cache finds the registry.
  CARGO_HOME: D:\cargo-home

jobs:
  # --------------------------------------------------------------- check
  check:
    name: Check (Windows)
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          cache-key: check
          msrv: ${{ env.MSRV }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Cargo check
        shell: msys2 {0}
        run: cargo check --workspace --all-targets --locked --keep-going
      - name: Clippy
        shell: msys2 {0}
        run: cargo clippy --workspace --locked --keep-going -- -D warnings

  # ---------------------------------------------------------------- test
  # Report-only until promoted: failures here do not fail the workflow.
  test:
    name: Tests (Windows, report-only)
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          cache-key: test
          msrv: ${{ env.MSRV }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Logic crates
        shell: msys2 {0}
        run: cargo test --locked --no-fail-fast -p impro-core -p impro-graph -p impro-gitviews
      - name: GUI crates (report only)
        continue-on-error: true
        shell: msys2 {0}
        run: cargo test --locked --workspace --no-fail-fast
      - name: WebView2 host test (report only)
        continue-on-error: true
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cargo test --locked -p impro-gitviews --test windows_webview --no-run
          # The test executable lives in target/debug/deps; the loader is not copied there.
          loader=$(scripts/package/windows/find-webview2-loader.sh target/debug/build)
          PATH="$(cygpath -u "$(dirname "$loader")"):$PATH"
          cargo test --locked -p impro-gitviews --test windows_webview -- --nocapture

  # ------------------------------------------------------------- package
  package:
    name: Package (installer + portable zip)
    runs-on: windows-2025
    timeout-minutes: 75
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          cache-key: release
          msrv: ${{ env.MSRV }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Read workspace version
        id: version
        shell: msys2 {0}
        run: |
          set -euo pipefail
          version=$(scripts/package/windows/workspace-version.sh .)
          echo "impro version: $version"
          echo "version=$version" >> "$(cygpath -u "$GITHUB_OUTPUT")"

      - name: Build release binary
        shell: msys2 {0}
        run: cargo build --release --locked -p impro

      - name: Bundle GTK runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # webview2-com-sys links the loader dynamically: it must sit next to impro.exe.
          loader=$(scripts/package/windows/find-webview2-loader.sh target/release/build)
          scripts/package/windows/bundle.sh target/release/impro.exe impro.exe dist/impro dist/out "$loader"

      - name: Bundle diagnostics (on failure)
        if: failure()
        shell: msys2 {0}
        run: scripts/package/windows/print-diagnostics.sh dist/out

      - name: Portable zip
        shell: msys2 {0}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package/windows/make-portable-zip.sh dist/impro "$VERSION" dist/out

      - name: Installer (Inno Setup)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package/windows/build-installer.ps1 -Version $env:VERSION -BundleDir dist\impro -OutDir dist\out

      - name: Checksums
        shell: msys2 {0}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          scripts/package/windows/write-checksums.sh dist/out "$VERSION"
          cat dist/out/SHA256SUMS.txt

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: impro-windows
          path: dist/out/*
          retention-days: 30
          if-no-files-found: error

  # --------------------------------------------------------------- smoke
  smoke:
    name: Smoke test (installed app)
    needs: package
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: impro-windows
          path: ${{ runner.temp }}\pkg
      - name: Installer, installed app, uninstaller
        shell: pwsh
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: >-
          ./packaging/windows/smoke.ps1 -Mode installer
          -Artifacts "$env:RUNNER_TEMP\pkg" -Version $env:VERSION
          -OutDir "$env:RUNNER_TEMP\smoke" -RequireFiles WebView2Loader.dll
      - name: Portable zip
        shell: pwsh
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: >-
          ./packaging/windows/smoke.ps1 -Mode portable
          -Artifacts "$env:RUNNER_TEMP\pkg" -Version $env:VERSION
          -OutDir "$env:RUNNER_TEMP\smoke" -RequireFiles WebView2Loader.dll
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-smoke
          path: ${{ runner.temp }}\smoke\*
          retention-days: 14
          if-no-files-found: ignore

  # ------------------------------------------------- package-standin
  # TEMPORARY scaffolding (see packaging/windows/README.md, "Packaging stand-in"):
  # runs the whole packaging pipeline with crates/impro-ui/examples/packaging_standin.rs
  # installed as impro.exe, until the real binary builds on Windows. Never part of
  # windows-success; artifacts are named windows-standin*, not the product names.
  package-standin:
    name: Package (stand-in, temporary)
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
        with:
          cache-key: standin
          msrv: ${{ env.MSRV }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Read workspace version
        id: version
        shell: msys2 {0}
        run: |
          set -euo pipefail
          version=$(scripts/package/windows/workspace-version.sh .)
          echo "impro version: $version"
          echo "version=$version" >> "$(cygpath -u "$GITHUB_OUTPUT")"

      - name: Build stand-in executable
        shell: msys2 {0}
        run: cargo build --release --locked -p impro-ui --example packaging_standin

      - name: Bundle GTK runtime
        shell: msys2 {0}
        run: scripts/package/windows/bundle.sh target/release/examples/packaging_standin.exe impro.exe dist/impro dist/out

      - name: Bundle diagnostics (on failure)
        if: failure()
        shell: msys2 {0}
        run: scripts/package/windows/print-diagnostics.sh dist/out

      - name: Portable zip
        shell: msys2 {0}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package/windows/make-portable-zip.sh dist/impro "$VERSION" dist/out

      - name: Installer (Inno Setup)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package/windows/build-installer.ps1 -Version $env:VERSION -BundleDir dist\impro -OutDir dist\out

      - name: Checksums
        shell: msys2 {0}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          scripts/package/windows/write-checksums.sh dist/out "$VERSION"
          cat dist/out/SHA256SUMS.txt

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-standin
          path: dist/out/*
          retention-days: 7
          if-no-files-found: ignore

  # --------------------------------------------------- smoke-standin
  # TEMPORARY scaffolding, see package-standin.
  smoke-standin:
    name: Smoke test (stand-in, temporary)
    needs: package-standin
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-standin
          path: ${{ runner.temp }}\pkg
      - name: Installer, installed app, uninstaller
        shell: pwsh
        env:
          VERSION: ${{ needs.package-standin.outputs.version }}
        run: >-
          ./packaging/windows/smoke.ps1 -Mode installer
          -Artifacts "$env:RUNNER_TEMP\pkg" -Version $env:VERSION
          -OutDir "$env:RUNNER_TEMP\smoke"
      - name: Portable zip
        shell: pwsh
        env:
          VERSION: ${{ needs.package-standin.outputs.version }}
        run: >-
          ./packaging/windows/smoke.ps1 -Mode portable
          -Artifacts "$env:RUNNER_TEMP\pkg" -Version $env:VERSION
          -OutDir "$env:RUNNER_TEMP\smoke"
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-standin-smoke
          path: ${{ runner.temp }}\smoke\*
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------- windows-success
  # Aggregate of the required jobs (the report-only `test` job is not listed).
  windows-success:
    name: Windows success
    needs:
      - check
      - package
      - smoke
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {name: job["result"] for name, job in needs.items() if job["result"] != "success"}
          for name, job in needs.items():
              print(name, job["result"])
          if bad:
              sys.exit("not successful: " + ", ".join(f"{n}={r}" for n, r in bad.items()))
          '
