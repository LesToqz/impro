version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Wait a week after a release before proposing it (supply-chain hygiene).
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The GTK3 / WebKit2GTK stack is pinned by design: gtk-rs 0.18 together
      # with webkit2gtk 2.0. Newer gtk-rs releases conflict with the `links`
      # key of webkit2gtk's -sys crates, so minor and major bumps of these
      # crates would only produce unbuildable pull requests. Patch updates
      # are still proposed.
      - dependency-name: "atk"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "atk-sys"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "cairo-rs"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "cairo-sys-rs"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "gdk"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "gdk-pixbuf"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "gdk-pixbuf-sys"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "gdk-sys"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "gio"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "gio-sys"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "glib"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "glib-macros"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "glib-sys"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "gobject-sys"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "gtk"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "gtk3-macros"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "gtk-sys"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "javascriptcore-rs"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "javascriptcore-rs-sys"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "pango"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "pangocairo"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "pangocairo-sys"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "pango-sys"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "soup3"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "soup3-sys"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "webkit2gtk"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "webkit2gtk-sys"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Wait a week after a release before proposing it (supply-chain hygiene).
    cooldown:
      default-days: 7
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - "*"
