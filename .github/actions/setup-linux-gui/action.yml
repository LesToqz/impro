name: Set up Linux GUI build
description: Install the GTK/VTE/WebKit build packages, a pinned Rust toolchain, a build cache and optionally cargo-nextest.

inputs:
  toolchain:
    description: Rust toolchain to install (version number or channel). Defaults to the workflow's RUST_VERSION.
    required: false
    default: ""
  components:
    description: Comma-separated rustup components.
    required: false
    default: rustfmt,clippy
  gui:
    description: Install GUI development/runtime packages, fonts and Xvfb ("true" or "false").
    required: false
    default: "true"
  nextest:
    description: Install cargo-nextest ("true" or "false").
    required: false
    default: "false"
  cache-key:
    description: Shared key for the Cargo build cache.
    required: true

runs:
  using: composite
  steps:
    - name: Install system packages
      if: inputs.gui == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential pkg-config \
          libgtk-3-dev libvte-2.91-dev libwebkit2gtk-4.1-dev \
          xvfb dbus dbus-x11 desktop-file-utils \
          fonts-dejavu-core fonts-noto-core \
          librsvg2-common adwaita-icon-theme yaru-theme-icon \
          gsettings-desktop-schemas at-spi2-core shared-mime-info

    - name: Install Rust toolchain
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain || env.RUST_VERSION }}
        COMPONENTS: ${{ inputs.components }}
      run: |
        args=(--profile minimal)
        if [[ -n $COMPONENTS ]]; then
          args+=(--component "$COMPONENTS")
        fi
        rustup toolchain install "$TOOLCHAIN" "${args[@]}"
        rustup default "$TOOLCHAIN"
        rustc --version
        cargo --version
        {
          echo "CARGO_BUILD_JOBS=$(nproc)"
          echo "CARGO_INCREMENTAL=0"
        } >> "$GITHUB_ENV"

    - name: Cache Cargo build
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.cache-key }}
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Install cargo-nextest
      if: inputs.nextest == 'true'
      uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: cargo-nextest@0.9.149
